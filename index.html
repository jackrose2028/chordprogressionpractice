<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Chord Progression Practice</title>
    <style>
:root {
    --bg-color: #121212;
    --surface-color: #1e1e1e;
    --primary-color: #bb86fc;
    --primary-variant-color: #3700b3;
    --secondary-color: #03dac6;
    --on-bg-color: #e0e0e0;
    --on-surface-color: #ffffff;
    --border-color: #333;
    --shadow-color: rgba(0, 0, 0, 0.5);
}

body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    color: var(--on-bg-color);
    margin: 0;
    line-height: 1.6;
}

#app {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem;
}

header {
    text-align: center;
    margin-bottom: 2rem;
}

h1 {
    color: var(--on-surface-color);
    font-weight: 700;
}

.filters {
    display: flex;
    gap: 1rem;
    justify-content: center;
    margin-top: 1rem;
}

#search-input, #category-filter {
    background-color: var(--surface-color);
    color: var(--on-bg-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-size: 1rem;
}

#search-input::placeholder {
    color: #888;
}

#progression-list {
    display: grid;
    gap: 1rem;
}

.progression-card {
    background-color: var(--surface-color);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1.5rem;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 2px 8px var(--shadow-color);
}

.progression-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 4px 12px var(--shadow-color);
    border-color: var(--primary-color);
}

.progression-card h3 {
    margin: 0 0 0.5rem;
    color: var(--primary-color);
}

.progression-card .category {
    font-size: 0.9rem;
    background-color: var(--primary-variant-color);
    color: var(--on-surface-color);
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    display: inline-block;
    margin-bottom: 1rem;
}

.progression-card .chords {
    font-family: monospace;
    font-size: 1.1rem;
    background-color: var(--bg-color);
    padding: 0.5rem;
    border-radius: 4px;
    margin-bottom: 1rem;
}

.progression-card .description {
    font-size: 0.95rem;
    color: #b0b0b0;
}

.roman-numerals {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    color: var(--secondary-color);
    margin: 0.5rem 0 1rem;
    text-align: center;
    font-weight: 600;
}

.roman-numerals-card {
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    color: var(--secondary-color);
    margin: 0.5rem 0;
    font-weight: 600;
}

.transpose-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin: 1rem 0;
}

.transpose-controls label {
    font-weight: 600;
    color: var(--on-surface-color);
}

#key-select {
    background-color: var(--surface-color);
    color: var(--on-bg-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 0.5rem;
    font-size: 1rem;
}

/* Modal Styles */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-content {
    background-color: var(--surface-color);
    padding: 2rem;
    border-radius: 12px;
    width: 90%;
    max-width: 600px;
    position: relative;
    box-shadow: 0 5px 20px var(--shadow-color);
}

.close-button {
    position: absolute;
    top: 10px;
    right: 15px;
    background: none;
    border: none;
    color: var(--on-bg-color);
    font-size: 2rem;
    cursor: pointer;
}

.practice-area {
    background-color: var(--bg-color);
    padding: 2rem;
    border-radius: 8px;
    margin: 1.5rem 0;
    text-align: center;
}

#chords-display {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    max-height: 200px;
    overflow-y: auto;
}

.chord-box {
    font-size: clamp(1rem, 4vw, 2rem);
    font-weight: bold;
    color: #999;
    padding: 0.5rem;
    transition: color 0.2s, transform 0.2s;
    min-width: 3rem;
    text-align: center;
    border-radius: 4px;
    background-color: var(--surface-color);
}

.chord-box.active {
    color: var(--secondary-color);
    transform: scale(1.2);
}

.beat-indicator-container {
    display: flex;
    justify-content: center;
    gap: 1.5rem;
    height: 20px;
}

.beat-indicator {
    width: 16px;
    height: 16px;
    background-color: #444;
    border-radius: 50%;
    transition: background-color 0.1s, transform 0.1s;
}
.beat-indicator.active {
    background-color: var(--secondary-color);
    transform: scale(1.2);
}

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2rem;
}

#play-pause-btn {
    background-color: var(--primary-color);
    color: var(--on-surface-color);
    border: none;
    padding: 0.75rem 2rem;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: background-color 0.2s;
}

#play-pause-btn:hover {
    background-color: var(--primary-variant-color);
}

.bpm-control {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
#bpm-slider {
    width: 150px;
}

#piano-keyboard {
    position: relative;
    margin: 2rem 0;
    height: 120px;
    display: flex;
    justify-content: center;
}

.white-keys {
    display: flex;
    gap: 1px;
}

.black-keys {
    position: absolute;
    top: 0;
    display: flex;
    gap: 1px;
    pointer-events: none;
}

.piano-key {
    transition: all 0.2s ease;
    cursor: pointer;
    border-radius: 0 0 4px 4px;
}

.white-key {
    width: 24px;
    height: 120px;
    background-color: #f8f8f8;
    border: 1px solid #ddd;
    color: #333;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    font-size: 10px;
    pointer-events: all;
}

.black-key {
    width: 16px;
    height: 75px;
    background-color: #2a2a2a;
    border: 1px solid #1a1a1a;
    margin-left: 16px;
    color: #fff;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 4px;
    font-size: 8px;
    pointer-events: all;
}

.black-key:first-child {
    margin-left: 16px;
}

.piano-key:hover {
    transform: translateY(2px);
}

.piano-key.active {
    background-color: var(--secondary-color) !important;
    color: #000 !important;
    transform: translateY(2px);
    box-shadow: 0 2px 8px rgba(3, 218, 198, 0.4);
}
</style>

function playSound(buffer, time, accent = false) {
    if (!audioContext || !buffer) return;
    const source = audioContext.createBufferSource();
    source.buffer = buffer;

    const gainNode = audioContext.createGain();

        this.onChordChange = onChordChange;
        this.onBeatChange = onBeatChange;
        this.bpm = 120;
        this.isPlaying = false;
        this.currentBeat = 0; // 0-3 for a 4/4 bar
        this.currentChordIndex = 0;
        
        // Use 1 beat per chord for long progressions, 4 beats for short ones
        this.beatsPerChord = chords.length > 4 ? 1 : 4;
        this.totalBeats = chords.length > 4 ? chords.length : 4;
        
        this.nextNoteTime = 0.0;
        this.scheduleAheadTime = 0.1; // seconds
        this.lookahead = 25.0; // ms
        this.timerID = null;
        
        setupAudio();
    }

    setBpm(bpm) {
        this.bpm = bpm;
    }

    nextNote() {
        const secondsPerBeat = 60.0 / this.bpm;
        this.nextNoteTime += secondsPerBeat;

        // Advance the beat
        this.currentBeat++;
        
        if (this.beatsPerChord === 1) {
            // For long progressions: 1 beat per chord
            if (this.currentBeat >= this.totalBeats) {
                this.currentBeat = 0;
            }
            this.currentChordIndex = this.currentBeat;
        } else {
            // For short progressions: 4 beats per chord
            if (this.currentBeat >= this.beatsPerChord) {
                this.currentBeat = 0;
                this.currentChordIndex = (this.currentChordIndex + 1) % this.chords.length;
            }
        }
    }
    
    scheduleNote(beatNumber, time) {
        // Play sound
        const isDownbeat = beatNumber === 0 || (this.beatsPerChord === 1);
        playSound(clickBuffer, time, isDownbeat);

        // Update UI right when the sound is scheduled to play
        setTimeout(() => {
            requestAnimationFrame(() => {
                this.onChordChange(this.currentChordIndex);
                
                // For beat indicators, show position within 4-beat cycle
                const displayBeat = this.beatsPerChord === 1 ? beatNumber % 4 : beatNumber;
                this.onBeatChange(displayBeat);
            });
        }, (time - audioContext.currentTime) * 1000);
    }
    
    scheduler() {
        while (this.nextNoteTime < audioContext.currentTime + this.scheduleAheadTime) {
            this.scheduleNote(this.currentBeat, this.nextNoteTime);
            this.nextNote();
        }
        this.timerID = setTimeout(() => this.scheduler(), this.lookahead);
    }

    start() {
        if (this.isPlaying) return;
        
        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }

        this.isPlaying = true;
        this.currentBeat = 0;
        this.currentChordIndex = -1; // Start before the first chord
        
        // Prime the loop
        if (this.currentChordIndex === -1) {
            this.currentChordIndex = 0;
        }

        this.nextNoteTime = audioContext.currentTime + 0.1;
        this.onChordChange(this.currentChordIndex);
        this.scheduler();
    }

    stop() {
        this.isPlaying = false;
        clearTimeout(this.timerID);
        this.onBeatChange(-1); // Turn off all beat indicators
    }
}

const { PracticeSession } = P;

let practiceSession;
let filteredProgressions = [...progressions];
let currentProgression = null;

function init() {
    const progressionListEl = document.getElementById('progression-list');
    const searchInput = document.getElementById('search-input');
    const categoryFilter = document.getElementById('category-filter');
    const modal = document.getElementById('practice-modal');
    const closeModalBtn = document.getElementById('close-modal');

    populateCategoryFilter(categories);
    renderProgressionList(filteredProgressions);

    progressionListEl.addEventListener('click', (e) => {
        const card = e.target.closest('.progression-card');
        if (card) {
            const id = card.dataset.id;
            const progression = progressions.find(p => p.id === id);
            if (progression) {
                openPracticeModal(progression);
            }
        }
    });
    
    searchInput.addEventListener('input', handleFilterChange);
    categoryFilter.addEventListener('change', handleFilterChange);

    closeModalBtn.addEventListener('click', () => {
        closePracticeModal();
    });
    modal.addEventListener('click', (e) => {
        if (e.target === modal) {
            closePracticeModal();
        }
    });
}

function handleFilterChange() {
    const searchInput = document.getElementById('search-input');
    const categoryFilter = document.getElementById('category-filter');
    const searchTerm = searchInput.value.toLowerCase();
    const selectedCategory = categoryFilter.value;

    filteredProgressions = progressions.filter(p => {
        const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchTerm) || p.description.toLowerCase().includes(searchTerm) || p.chords.join(' ').toLowerCase().includes(searchTerm);
        return matchesCategory && matchesSearch;
    });

    renderProgressionList(filteredProgressions);
}

function openPracticeModal(progression) {
    const modal = document.getElementById('practice-modal');
    currentProgression = progression;
    updatePracticeModal(progression);

    if (practiceSession) {
        practiceSession.stop();
    }
    
    // Set key selector to original key
    const keySelect = document.getElementById('key-select');
    keySelect.value = progression.originalKey;
    
    practiceSession = new PracticeSession(progression.chords, updateActiveChordUI, updateBeatIndicator);

    const playPauseBtn = document.getElementById('play-pause-btn');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmValue = document.getElementById('bpm-value');

    playPauseBtn.textContent = 'Play';
    playPauseBtn.onclick = () => {
        if (practiceSession.isPlaying) {
            practiceSession.stop();
            playPauseBtn.textContent = 'Play';
        } else {
            practiceSession.start();
            playPauseBtn.textContent = 'Pause';
        }
    };
    
    bpmSlider.oninput = () => {
        const bpm = parseInt(bpmSlider.value);
        bpmValue.textContent = bpm;
        practiceSession.setBpm(bpm);
    };
    
    // Key transpose handler
    keySelect.onchange = () => {
        const newKey = keySelect.value;
        const transposedChords = transposeProgression(progression.chords, progression.originalKey, newKey);
        updateChordsDisplay(transposedChords);
        
        // Update practice session with new chords
        if (practiceSession) {
            const wasPlaying = practiceSession.isPlaying;
            practiceSession.stop();
            practiceSession = new PracticeSession(transposedChords, updateActiveChordUI, updateBeatIndicator);
            practiceSession.setBpm(parseInt(bpmSlider.value));
            
            if (wasPlaying) {
                practiceSession.start();
                playPauseBtn.textContent = 'Pause';
            }
        }
    };
    
    // Initialize BPM
    practiceSession.setBpm(parseInt(bpmSlider.value));

    modal.style.display = 'flex';
}

function closePracticeModal() {
    if (practiceSession) {
        practiceSession.stop();
    }
    const modal = document.getElementById('practice-modal');
    modal.style.display = 'none';
}

init();
</script>
